server:
  port: 8080

spring:
  application:
    name: enterprise-kb-assistant

  datasource:                          # 新增：PostgreSQL 数据源
    url: jdbc:postgresql://localhost:5432/kbdb
    username: kbuser
    password: kbpass

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:7b
          temperature: 0.7
      embedding:
        model: nomic-embed-text

    vectorstore:                       # 新增：PGVector 配置
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768                # nomic-embed-text 输出 768 维

# 自定义业务配置
app:
  knowledge:
    auto-ingest: true          # 启动时是否自动把 knowledge/*.txt 入库
    top-k: 4                   # RAG 检索返回的片段数
    similarity-threshold: 0.55 # 相似度阈值，低于此值不采纳
