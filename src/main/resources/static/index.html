<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业知识库问答助手</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
               background: #f5f7fa; color: #1f2329; }
        .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 120px; }
        h1 { font-size: 20px; margin: 0 0 4px; }
        .sub { color: #8a9099; font-size: 13px; margin-bottom: 16px; }
        #log { background: #fff; border: 1px solid #e6e9ef; border-radius: 12px;
               padding: 16px; min-height: 320px; max-height: 60vh; overflow-y: auto; }
        .msg { margin: 10px 0; line-height: 1.6; white-space: pre-wrap; }
        .msg .who { font-size: 12px; font-weight: 600; color: #4e6ef2; display: block; margin-bottom: 2px; }
        .msg.bot .who { color: #16a34a; }
        .bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
               border-top: 1px solid #e6e9ef; padding: 12px; }
        .bar-inner { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
        input { flex: 1; padding: 10px 12px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 14px; }
        button { padding: 10px 18px; border: none; border-radius: 8px; background: #4e6ef2; color: #fff;
                 font-size: 14px; cursor: pointer; }
        button:disabled { opacity: .5; cursor: default; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>企业知识库问答助手</h1>
    <div class="sub">基于 Spring AI（RAG + 工具调用 + 记忆 + 流式）。试试：年假怎么算？/ 查一下张三的工号 / 远程办公用 VPN 有什么要求？</div>
    <div id="log"></div>
</div>
<div class="bar">
    <div class="bar-inner">
        <input id="q" placeholder="输入你的问题，回车发送" autofocus>
        <button id="send">发送</button>
    </div>
</div>

<script>
    // 每个浏览器标签页一个会话；刷新即新会话（与后端 sessionId 对应）
    const sessionId = crypto.randomUUID();
    const log = document.getElementById('log');
    const input = document.getElementById('q');
    const sendBtn = document.getElementById('send');

    function append(who, cls) {
        const div = document.createElement('div');
        div.className = 'msg ' + cls;
        const label = document.createElement('span');
        label.className = 'who';
        label.textContent = who;
        const body = document.createElement('span');
        body.className = 'body';
        div.appendChild(label);
        div.appendChild(body);
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        return body;
    }

    async function send() {
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        sendBtn.disabled = true;
        append('我', 'user').textContent = text;
        const body = append('助手', 'bot');

        // fetch + ReadableStream 读取流式响应，逐字渲染
        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId, message: text })
        });
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            body.textContent += decoder.decode(value, { stream: true });
            log.scrollTop = log.scrollHeight;
        }
        sendBtn.disabled = false;
        input.focus();
    }

    sendBtn.onclick = send;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
