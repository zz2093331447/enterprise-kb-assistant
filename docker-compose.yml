services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    command: serve
    # 健康检查：让 app 等服务真正"可用"后再启动，而不是只等容器起来
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgvector:
    image: pgvector/pgvector:pg16        # 已预装 vector 扩展的 Postgres 16
    environment:
      POSTGRES_DB: kbdb
      POSTGRES_USER: kbuser
      POSTGRES_PASSWORD: kbpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:                          # 等数据库真能连上再放行
      test: ["CMD-SHELL", "pg_isready -U kbuser -d kbdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # 容器内不能用 localhost 访问 ollama（那是容器自己），要用 compose 服务名
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pgvector:5432/kbdb
    depends_on:
      ollama:
        condition: service_healthy
      pgvector:
        condition: service_healthy

volumes:
  ollama-data:
  pgdata:
