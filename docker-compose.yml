services:
  pgvector:
    image: pgvector/pgvector:pg16        # 已预装 vector 扩展的 Postgres 16
    environment:
      POSTGRES_DB: kbdb
      POSTGRES_USER: kbuser
      POSTGRES_PASSWORD: kbpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:                          # 等数据库真能连上再放行
      test: ["CMD-SHELL", "pg_isready -U kbuser -d kbdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # 容器内访问宿主机用 host.docker.internal，不是 localhost（那是容器自己）
      - SPRING_AI_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pgvector:5432/kbdb
    extra_hosts:                          # 让 Linux 容器也能解析 host.docker.internal
      - "host.docker.internal:host-gateway"
    depends_on:
      pgvector:                           # 只依赖数据库，ollama 用本机的
        condition: service_healthy

volumes:
  pgdata:
